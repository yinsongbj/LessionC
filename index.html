<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="C语言开发视角全面教程 —— 按章节组织的交互式教程网站，实用优先、多代码、多坑点、多调试。">
<title>C语言开发视角全面教程</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 移动端抽屉遮罩 ============ -->
<div class="scrim" id="scrim" hidden></div>

<div class="layout">

  <!-- ============ 左侧固定侧边栏 ============ -->
  <aside class="sidebar" id="sidebar" aria-label="课程目录">
    <header class="side-head">
      <div class="brand">
        <div class="brand-mark">C</div>
      <div class="brand-text">
        <h1>C语言开发视角</h1>
        <p>全面教程 · 阅读模式</p>
      </div>
    </div>
    <button class="icon-btn side-close" id="btnClose" title="关闭目录" aria-label="关闭目录">&times;</button>
  </header>

  <a class="mode-switch" href="slides.html" title="切换到讲义模式 (一页一屏, 适合投屏授课)">
    <span class="ms-ico">📖</span>
    <span class="ms-text">阅读模式 · 切换到<strong>讲义模式</strong></span>
  </a>

    <div class="search-box">
      <svg class="search-ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/></svg>
      <input type="search" id="search" placeholder="搜索章节 / 关键词" autocomplete="off" aria-label="搜索章节">
      <kbd class="search-kbd">/</kbd>
    </div>

    <div class="side-progress">
      <div class="sp-row">
        <span class="sp-label">阅读进度</span>
        <span class="sp-count" id="spCount">0 / 14</span>
      </div>
      <div class="sp-bar"><div class="sp-fill" id="spFill"></div></div>
    </div>

    <nav class="chapter-nav" id="chapterNav" aria-label="章节列表"></nav>

    <footer class="side-foot">
      <button class="theme-btn" id="btnTheme" title="切换暗色 / 亮色">
        <span class="theme-ico" id="themeIco">☾</span>
        <span id="themeTxt">深色模式</span>
      </button>
      <span class="side-ver">v1.0 · 零依赖</span>
    </footer>
  </aside>

  <!-- ============ 右侧主内容区 ============ -->
  <main class="main" id="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" title="目录" aria-label="打开目录">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-meta">
        <span class="crumb" id="crumb"></span>
        <span class="topbar-title" id="topTitle"></span>
      </div>
      <div class="topbar-time" id="topTime"></div>
      <div class="topbar-nav">
        <button class="nav-btn" id="btnPrev" title="上一章 (←)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><polyline points="12,4 6,10 12,16"/></svg>
          <span>上一章</span>
        </button>
        <button class="nav-btn" id="btnNext" title="下一章 (→)">
          <span>下一章</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><polyline points="8,4 14,10 8,16"/></svg>
        </button>
      </div>
    </div>

    <!-- 阅读进度条（随滚动变化） -->
    <div class="scroll-progress"><div class="scroll-fill" id="scrollFill"></div></div>

    <article class="content" id="content" tabindex="-1"></article>

    <footer class="page-nav" id="pageNav"></footer>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/chapters.js"></script>
<script src="js/exercises.js"></script>
<script src="js/outputs.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
